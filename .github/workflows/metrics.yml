name: Metrics
on:
  # Запускать раз в день по расписанию и вручную
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  # Также запускать при каждом пуше в основную ветку
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # ... здесь будут ваши плагины и опции
